:root{--bg:#262624;--card:#30302e;--card2:#3a3936;--ink:#f3f1ea;--muted:#a8a59b;--accent:#d97757;--accent2:#c96442;--good:#8fbf8f;--bad:#e5786d;--line:#45443f;--gold:#d4a65a;--silver:#b8b5ac;--bronze:#c08a62;--shade:#000000b0;--onaccent:#1f1e1d;color-scheme:dark}
:root[data-theme="light"]{--bg:#f5f4ee;--card:#ffffff;--card2:#efede5;--ink:#1f1e1d;--muted:#6b6a64;--accent:#c96442;--accent2:#b0553a;--good:#4f7f52;--bad:#b9483c;--line:#e3e0d6;--gold:#b8892f;--silver:#9a978e;--bronze:#a87650;--shade:#1f1e1d88;--onaccent:#ffffff;color-scheme:light}
:root[data-theme="dark"]{}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.sheethead h2,.headline,.title h2,.dialog h3,.card>b:first-child{font-family:ui-serif,"Tiempos Text","Source Serif 4",Georgia,Cambria,serif;letter-spacing:-.005em}
h3{font-weight:600}
button{font:inherit;border:1px solid var(--line);border-radius:10px;padding:.55rem .9rem;background:var(--card2);color:var(--ink);cursor:pointer;min-height:44px;transition:background .15s,border-color .15s}button:hover{border-color:var(--muted)}
button.primary,.seg button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:600}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button.ghost{background:transparent;border:1px solid var(--line)}button:disabled{opacity:.6}
input,textarea{font:inherit;padding:.6rem .8rem;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);min-height:44px;flex:1;min-width:0}
label{display:block;margin:1rem 0 .35rem;font-weight:600}label.check{display:flex;gap:.5rem;align-items:center;font-weight:500}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:.6rem;justify-content:space-between;align-items:center;padding:.7rem 1rem;background:var(--card);border-bottom:1px solid var(--line);font-size:.95rem}
.funds{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}.date{color:var(--muted);font-size:.85rem}
.content{flex:1;padding-block:.8rem 10rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nextbar{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;gap:.5rem;padding:.5rem 1rem;max-width:560px;margin:0 auto;background:linear-gradient(transparent,var(--bg) 30%)}
.next{flex:1;background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:600;font-size:1.05rem;min-height:52px;border-radius:14px;letter-spacing:.01em}.step{width:52px;font-weight:600}
.tabs{position:fixed;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:content-box;left:0;right:0;display:flex;max-width:560px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);height:64px}
.tabs button{flex:1;background:none;border:0;border-radius:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;font-size:.75rem;padding:.3rem}.tabs button span{font-size:1.3rem}.tabs button.on{color:var(--accent);font-weight:600}.tabs button span{filter:saturate(.75)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.85rem .95rem;margin:.6rem 0}.card.danger{border:2px solid var(--bad)}.tap{cursor:pointer}.past{opacity:.55}
.row{display:flex;gap:.5rem;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.muted{color:var(--muted);font-size:.9rem}.small{font-size:.8rem}
.feedhdr{margin:1.1rem 0 .3rem;font-weight:600;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em}
.feed{display:flex;gap:.6rem;padding:.55rem .2rem;border-bottom:1px solid var(--line)}.feed span{font-size:1.2rem}.feed.tap div{text-decoration:underline dotted}
.horse{display:flex;gap:.7rem}.silks{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem}.chips span{background:var(--bg);border-radius:999px;padding:.15rem .55rem;font-size:.82rem}
.horse .next{margin-top:.3rem;font-size:.85rem;color:var(--accent)}
.overlay{position:fixed;inset:0;background:var(--shade);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:1rem 1rem 2rem}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:.5rem}.sheethead h2{margin:.2rem 0;font-size:1.25rem}
.headline{font-weight:600;margin:.6rem 0;font-size:1.05rem}.seg{display:flex;gap:.3rem;margin:.5rem 0}.seg button{flex:1;display:flex;flex-direction:column;align-items:center}.seg small{font-size:.75rem;opacity:.8}
table.res{width:100%;border-collapse:collapse;margin:.5rem 0}table.res td,table.res th{padding:.45rem .3rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}table.res tr.ours{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.grid2{display:grid;grid-template-columns:auto 1fr;gap:.35rem .8rem;margin:.8rem 0}.grid2>div:nth-child(odd){color:var(--muted)}
.quote{font-style:italic}.formrow{display:flex;gap:.6rem;flex-wrap:wrap;padding:.4rem 0;border-bottom:1px solid var(--line);justify-content:space-between}.neg{color:var(--bad)}.pos{color:var(--good)}
.months{display:flex;gap:.3rem;overflow-x:auto;padding-bottom:.4rem;margin-bottom:.4rem}.months button{flex:none;min-width:52px}.months button.on{background:var(--accent);color:var(--onaccent)}
.race{display:flex;gap:.7rem;align-items:center}.grade{font-weight:600;border-radius:10px;padding:.35rem .5rem;min-width:52px;text-align:center;background:var(--line);font-size:.85rem}.gG1{background:var(--gold);color:#17202b}.gG2{background:var(--silver);color:#17202b}.gG3{background:var(--bronze);color:#17202b}
.menu{display:flex;flex-direction:column;gap:.6rem}.menu button{text-align:left;padding:.9rem 1rem;font-size:1rem;background:var(--card)}
.title{max-width:560px;margin:0 auto;padding:2rem 1rem}.title h1{font-size:2.1rem;margin:.5rem 0;font-family:ui-serif,Georgia,serif;font-weight:500}.slot{display:flex;gap:.7rem;align-items:center}
h3{margin:1.1rem 0 .4rem}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.overlay.center{align-items:center;z-index:40}.dialog{background:var(--card);border-radius:20px;padding:1.2rem;width:min(92vw,420px)}.dialog p{margin:0 0 1rem}.row.end{justify-content:flex-end;margin-top:.8rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.who{display:flex;align-items:center;gap:8px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.sw{width:36px;height:36px;min-height:36px;border-radius:50%;padding:0;border:2px solid var(--line)}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.silkprev{position:sticky;top:0;z-index:2;display:flex;justify-content:center;padding:8px;background:var(--card);border-radius:16px;border:1px solid var(--line)}
.seg.wrap{flex-wrap:wrap}
.seg.wrap button{flex:0 0 auto}
select{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.auction{text-align:center}
.auction .row.end{justify-content:space-between}
.bigprice{font-size:2.4rem;font-weight:600;font-family:ui-serif,Georgia,serif;color:var(--accent);margin:6px 0}
.countdown{letter-spacing:6px;color:var(--gold);font-size:1.2rem}
button.big{font-size:1.15rem;padding:14px 20px}

.eras{display:flex;flex-direction:column;gap:8px}.card.era{text-align:left;width:100%;font:inherit;color:var(--ink);cursor:pointer}.card.era.on{outline:3px solid var(--accent)}

.card.debug{border:2px dashed var(--gold)}
.res tr{cursor:pointer}

.statbar{display:grid;grid-template-columns:8.5em 1fr 2.2em;align-items:center;gap:8px;margin:4px 0}.statbar .bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.statbar .bar i{display:block;height:100%;background:var(--accent)}.statbar b{text-align:right}

.statbar{grid-template-columns:8.5em 1fr 3.4em}

.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.hscroll .card.mini{min-width:78%;flex:0 0 auto}.stars{color:var(--gold);letter-spacing:1px}
.chip{display:inline-block;background:var(--card2,rgba(127,127,127,.12));border-radius:999px;padding:.15rem .55rem;margin:.15rem .25rem .15rem 0;font-size:.8rem}
.tutbar{position:fixed;left:0;right:0;max-width:540px;margin:0 auto;bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:30;padding:0 10px}.tutbar .card{margin:0;box-shadow:0 4px 18px #0003}

.chip{background:var(--card2)!important;border:1px solid var(--line)}
.top{background:var(--bg)!important}
.sheet{background:var(--bg)}
.dialog{border:1px solid var(--line)}
::selection{background:color-mix(in srgb,var(--accent) 40%,transparent)}
input[type=checkbox]{flex:none;width:22px;height:22px;min-height:0;padding:0;margin:0;accent-color:var(--accent)}label.check{justify-content:flex-start;margin:.7rem 0}
.nextup{margin-top:6px;font-size:.85em;color:var(--accent)}
.runlist{max-height:30vh;overflow:auto;margin-top:6px;border-top:1px solid var(--card2)}
.runrow{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;font-size:.9em}
.runrow.mine{background:color-mix(in srgb,var(--accent) 28%,transparent);font-weight:700;outline:1px solid var(--accent)}
.capnum{min-width:24px;text-align:center;border-radius:4px;border:2px solid #000;font-weight:700;font-size:.85em;padding:1px 3px}
.seg.wrap button{white-space:normal;max-width:100%;text-align:left}
.lnk{color:var(--accent);cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-underline-offset:3px}
.searchbar{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.actgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.actgrid button{text-align:left;white-space:normal}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}.tile{background:var(--card2);border-radius:12px;padding:10px}.tile b{display:block;font-size:1.4em;font-family:var(--serif,Georgia,serif)}
.hchips{display:flex;flex-wrap:wrap;gap:6px}.hchip{background:var(--card2);border-radius:10px;padding:6px 10px;font-size:.9em;cursor:pointer;border:1px solid transparent}.hchip.star{border-color:#d4a017}
.tickrow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:var(--card2);margin:4px 0}
/* BitLife-style pop-ups: one centred card, big icon, short text, full-width stacked buttons */
.overlay.center{display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.62);backdrop-filter:blur(2px)}
.overlay.center>.dialog{width:100%;max-width:400px;margin:0 auto;border-radius:22px;padding:22px 18px 16px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:popin .18s ease-out;max-height:86vh;overflow:auto}
@keyframes popin{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.popicon{font-size:52px;line-height:1;margin:2px 0 10px}
.poptitle{margin:0 0 6px;font-size:1.15em}
.poptext{margin:0 0 14px;line-height:1.45;font-size:1.02em}
.overlay.center>.dialog .row.end{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.overlay.center>.dialog .row.end>button{width:100%;margin:0;padding:13px 14px;border-radius:14px;font-weight:600;font-size:1em}
.overlay.center>.dialog .row.end>button.ghost{background:var(--card2);border:none}
.overlay.center>.dialog input{width:100%;margin-bottom:8px;text-align:center}
.overlay.center>.dialog .tickrow{text-align:left}
.pophead{margin:-22px -18px 14px;padding:9px 12px;border-radius:22px 22px 0 0;color:#fff;font-weight:800;letter-spacing:.14em;font-size:.78em}
.popflav{margin:-8px 0 14px;font-style:italic;color:var(--muted);font-size:.92em}
.overlay:not(.center)>.sheet{max-height:92vh;overflow:auto;width:100%;max-width:560px}
:root[data-theme="light"] .overlay.center{background:rgba(30,30,28,.45)}
.overlay.center>.dialog .tickrow input[type=checkbox],.tickrow input[type=checkbox]{width:22px;height:22px;flex:none;margin:0}
.tickrow .grow{min-width:0;text-align:left}.tickrow select{width:100%;margin-top:4px}
.edrow{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--line)}.edk{flex:1;min-width:0;font-size:.85em;word-break:break-word}.edrow input:not([type=checkbox]):not([type=range]){width:44%;padding:6px 8px}.edrow input[type=range]{width:50%}
.ednest{margin-left:10px;padding-left:8px;border-left:2px solid var(--line)}.edopen{display:block;width:100%;text-align:left;background:none;border:none;padding:6px 0;color:var(--ink);font-weight:600}
.tickgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.formrow.mine{background:color-mix(in srgb,var(--accent) 18%,transparent);border-radius:8px;padding:4px 6px}
.chip.g1{background:#b8892f;color:#fff;border-radius:6px;padding:0 6px;font-size:.8em}.chip.g2{background:#6b7280;color:#fff;border-radius:6px;padding:0 6px;font-size:.8em}.chip.g3{background:#8b5a2b;color:#fff;border-radius:6px;padding:0 6px;font-size:.8em}
.poptext{white-space:pre-line}
