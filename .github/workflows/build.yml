name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: RacingDynasty-apk, path: android/app/build/outputs/apk/debug/*.apk }
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk RacingDynasty.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Racing Dynasty (latest build)
          make_latest: true
          files: RacingDynasty.apk
