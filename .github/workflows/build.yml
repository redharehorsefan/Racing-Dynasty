name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Icon and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#262624' --splashBackgroundColor '#262624'
      - name: Portrait only, documents access
        run: |
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Same signing key every build (so updates install over the old app)
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk RacingDynasty.apk
      - uses: actions/upload-artifact@v4
        with: { name: RacingDynasty-apk, path: RacingDynasty.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Racing Dynasty (latest build)
          make_latest: true
          files: RacingDynasty.apk
